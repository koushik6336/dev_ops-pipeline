<!DOCTYPE html>
<html>
<head>
    <title>DevOps + AIOps Pipeline</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
            color: #dcdcdc;
        }

        .card {
            background: white;
            color: black;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            color: white;
            background: #ff7b00;
            border-radius: 5px;
            text-decoration: none;
        }

        .btn:hover {
            background: #ff5500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 DevOps + AIOps Pipeline</h1>
        <p>CI/CD Pipeline with Jenkins + Docker</p>

        <div class="card">
            <h3>Application Status</h3>
            <p>✅ Running Successfully</p>
        </div>

        <div class="card">
            <h3>Endpoints</h3>
            <a class="btn" href="/hello">Hello API</a>
            <a class="btn" href="/health">Health Check</a>
        </div>
    </div>
</body>
</html>
